name: STV MobileReader iOS chapter loading timeout fix
on:
  workflow_dispatch:
  push:
    branches: [stv-capacitor-rebuild]
    paths: [.github/workflows/stv-ios-simulator-diagnostics.yml, 'repair/package.json', 'repair/capacitor.config.json', 'repair/patch_app_delegate.py', 'repair/stv-ios-compat.js', 'repair/stv-ios-tts.js', 'repair/finalize_ios_133.py', 'repair/import_stv_133.py', 'repair/stv-ios-reader-feedback.js', 'repair/stv-ios-http-bridge.js']
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Simulator and app
        shell: bash
        working-directory: repair
        run: |
          set -euo pipefail
          node --version
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 -o /tmp/stv-1.3.3.apk https://staticvn.sangtacvietcdn.xyz/download/stvmobilereader-1.3.3.apk
          python3 import_stv_133.py /tmp/stv-1.3.3.apk www
          python3 finalize_ios_133.py
          python3 patch_app_delegate.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ios/App/App/AppDelegate.swift")
          s=p.read_text()
          s=s.replace('STVActions.shared.prepare()', 'STVActions.shared.prepare()\n        stvSimulatorDiagnostics()', 1)

          # Collect real iOS WebKit exceptions from the beginning of navigation.
          s=s.replace('web.load(request)', '''
                  let errorHook = #"""
                    (() => {
                      window.__STV_ERROR_LOG = [];
                      window.addEventListener("error", e => {
                        window.__STV_ERROR_LOG.push({type:"error",message:String(e.message),file:String(e.filename),line:e.lineno,stack:String(e.error?.stack || "")});
                      }, true);
                      window.addEventListener("unhandledrejection", e => {
                        window.__STV_ERROR_LOG.push({type:"promise",message:String(e.reason),stack:String(e.reason?.stack || "")});
                      }, true);
                    })()
                    """#
                  web.configuration.userContentController.addUserScript(WKUserScript(source:errorHook, injectionTime:.atDocumentStart, forMainFrameOnly:true))
                  web.load(request)
          ''',1)
          s += """
          private func stvSimulatorDiagnostics() {
              let delays: [Double] = [3, 9, 16, 25]
              for delay in delays {
                  DispatchQueue.main.asyncAfter(deadline: .now()+delay) {
                      let window=UIApplication.shared.connectedScenes.compactMap({$0 as? UIWindowScene}).flatMap({$0.windows}).first(where:{$0.isKeyWindow})
                      func search(_ view: UIView?) -> WKWebView? {
                          guard let view=view else {return nil}
                          if let web=view as? WKWebView {return web}
                          for child in view.subviews {if let w=search(child){return w}}
                          return nil
                      }
                      let js = #"(()=>{try{return JSON.stringify({url:location.href,origin:location.origin,app:typeof window.app,theme:typeof window.app?.theme,color:typeof window.app?.theme?.getColorVar,search:typeof window.app?.fun?.showSearch,sync:typeof window.app?.history?.showSynchronizer,init:typeof window.app?.init,state:document.readyState,dbLoaded:typeof onDbLoad === 'object' ? onDbLoad.isLoaded : 'absent',historyLoaded:window.app?.history?.loaded,sqlitePlugin:typeof window.Capacitor?.Plugins?.CapacitorSQLite,compat:window.ui?.style?.create?.__stvIOSCompat===true,errors:window.__STV_ERROR_LOG||[],html:document.body?.innerText?.slice(0,220),links:[...document.scripts].slice(-12).map(x=>x.src),nav:performance.getEntriesByType('resource').filter(x=>x.name.includes('app.v2')).map(x=>x.name)})}catch(e){return 'JS_ERROR: '+e.message}})()"#
                      guard let web=search(window?.rootViewController?.view) else {
                          saveSTVSimResult("time=\\(delay) no_webview")
                          return
                      }
                      web.evaluateJavaScript(js) { result, error in
                          saveSTVSimResult("time=\\(delay) response=\\(String(describing:result)) error=\\(String(describing:error))")
                      }
                  }
              }
          }
          private func saveSTVSimResult(_ text: String) {
              let folder=FileManager.default.urls(for:.documentDirectory,in:.userDomainMask)[0]
              let url=folder.appendingPathComponent("stv-sim-results.txt")
              let existing=(try? String(contentsOf:url,encoding:.utf8)) ?? ""
              try? (existing+text+"\\n").write(to:url,atomically:true,encoding:.utf8)
              print("STV_SIM: "+text)
          }
          """
          p.write_text(s)
          PY
          xcrun simctl list devices available
          xcrun simctl list runtimes
      - name: Build iOS Simulator
        working-directory: repair
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/stvsim" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "$RUNNER_TEMP/sim-build.log" 2>&1 || { tail -150 "$RUNNER_TEMP/sim-build.log"; exit 1; }
          test -s "$RUNNER_TEMP/stvsim/Build/Products/Debug-iphonesimulator/App.app/App"
      - name: Build distributable unsigned iPhone ARM64 IPA
        working-directory: repair
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/stvdevice" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > "$RUNNER_TEMP/iphone-build.log" 2>&1 || { tail -180 "$RUNNER_TEMP/iphone-build.log"; exit 1; }
          APP="$RUNNER_TEMP/stvdevice/Build/Products/Release-iphoneos/App.app"
          test -s "$APP/App"
          xcrun lipo -archs "$APP/App" | grep -w arm64
          mkdir -p Payload
          ditto "$APP" Payload/App.app
          zip -qry STVMobileReader-133-ReaderTimeout-Fixed-unsigned.ipa Payload
          unzip -t STVMobileReader-133-ReaderTimeout-Fixed-unsigned.ipa > /dev/null
          ls -lh STVMobileReader-133-ReaderTimeout-Fixed-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: STVMobileReader-133-ReaderTimeout-Fixed-unsigned-IPA
          path: repair/STVMobileReader-133-ReaderTimeout-Fixed-unsigned.ipa
          retention-days: 7
      - name: Launch app and capture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simdevices.json"
          UDID=$(python3 - "$RUNNER_TEMP/simdevices.json" <<'PY'
          import json,sys
          devices=json.load(open(sys.argv[1]))['devices']
          pool=[d for group in devices.values() for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          print(pool[0]['udid'] if pool else '')
          PY
          )
          if [ -z "$UDID" ]; then echo "No simulator available"; exit 2; fi
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/stvsim/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$UDID" com.stvreader.capacitor.rebuild
          sleep 32
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          xcrun simctl io "$UDID" screenshot "$GITHUB_WORKSPACE/diagnostics/stv-screen.png" || true
          DATA=$(xcrun simctl get_app_container "$UDID" com.stvreader.capacitor.rebuild data)
          cp "$DATA/Documents/stv-sim-results.txt" "$GITHUB_WORKSPACE/diagnostics/" || true
          echo "=== STV Sim ==="
          cat "$GITHUB_WORKSPACE/diagnostics/stv-sim-results.txt" || true
          python3 - "$GITHUB_WORKSPACE/diagnostics/stv-sim-results.txt" <<'PY'
          import json,re,sys
          data=open(sys.argv[1]).read()
          entries=[]
          for line in data.splitlines():
              match=re.search(r'response=Optional\((\{.*\})\) error=nil',line)
              if match:
                  try: entries.append(json.loads(match.group(1)))
                  except Exception: pass
          print('INIT_STATES',[(x.get('url'),x.get('theme'),x.get('dbLoaded'),x.get('search')) for x in entries])
          assert entries, 'No WebView diagnostic state could be parsed'
          final=entries[-1]
          print('WEBKIT_ERRORS',final.get('errors'))
          assert final.get('theme') == 'object', 'app.theme missing at 25 seconds'
          assert final.get('color') == 'function', 'app.theme.getColorVar missing'
          assert final.get('search') == 'function', 'STV search missing'
          assert final.get('sync') == 'function', 'STV history synchronization missing'
          assert final.get('dbLoaded') is True, 'Database readiness event not fired'
          assert final.get('compat') is True, 'Native compatibility injection was not applied'
          assert 'history\nfollow\nbookmark' not in final.get('html',''), 'STV text has not translated'
          print('PASS: iOS Simulator STV fully initialized')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: STV-iOS-Simulator-diagnostics
          path: diagnostics/
          retention-days: 3
