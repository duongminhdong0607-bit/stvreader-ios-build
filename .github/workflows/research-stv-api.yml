name: Research STV public API for native client
on:
  workflow_dispatch:
  push:
    branches: [stv-native-online-reader]
    paths: [.github/workflows/research-stv-api.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare headless browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Inspect unauthenticated public search and book API
        run: |
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            let records=[];
            page.on('request',r=>{
              try{
                const u=new URL(r.url());
                if(u.hostname==='sangtacviet.com' && (/\/io\/|\/index.php|\/mobile\/bookmanage.php/.test(u.pathname))){
                  const post=r.postData()||'';
                  const fields=/password|pass|token|cookie|auth|key/i.test(post)?'REDACTED':post.slice(0,500);
                  records.push({kind:'request',method:r.method(),path:u.pathname,query:u.search.slice(0,240).replace(/(key|token|auth|password)=[^&]+/ig,'$1=REDACTED'),post:fields})
                }
              }catch(e){}
            });
            page.on('response',async r=>{
              try {
                const u=new URL(r.url());
                if(u.hostname==='sangtacviet.com' && (/\/io\/|\/index.php|\/mobile\/bookmanage.php/.test(u.pathname))){
                  const typ=r.headers()['content-type']||'';
                  let sample='';
                  if(/json|text|html/i.test(typ)) sample=(await r.text()).slice(0,1400);
                  records.push({kind:'response',path:u.pathname,status:r.status(),type:typ,text:sample.replace(/(["'](?:access|token|cookie|auth|password)["']\s*[:=]\s*)["'][^"']+["']/gi,'$1[REDACTED]')})
                }
              }catch(e){}
            });
            page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,500)));
            await page.addInitScript({content:require('fs').readFileSync('tools/stv-js-research-shim.js','utf8')});
            await page.addInitScript(()=>{
              const noop=()=>Promise.resolve({});
              window.Capacitor={platform:'ios',getPlatform:()=> 'ios',Plugins:{
                App:{getLaunchUrl:async()=>null,addListener:noop,exitApp:noop},
                StatusBar:{setStyle:noop,hide:noop,show:noop,setOverlaysWebView:noop},
                Keyboard:{addListener:noop}
              }};
              window.nativeclick={trigger(){}};
            });
            await page.goto('https://sangtacviet.com/app.v2.php',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(8000);
            await page.evaluate(()=>app.fun.showSearch());
            const inputs=page.locator('input:visible');
            for(let i=0;i<await inputs.count();i++){
              const inp=inputs.nth(i);
              const ph=(await inp.getAttribute('placeholder'))||'';
              if(/tìm truyện|tên truyện|search/i.test(ph)){
                await inp.fill('Hồng Hoang'); await inp.press('Enter'); break;
              }
            }
            await page.waitForTimeout(3500);
            try{await page.getByText('Hồng Hoang chi Minh Hà một kiếm',{exact:true}).first().click({timeout:7000})}catch(e){console.log('BOOK_CLICK_ERROR',e.message.slice(0,300))}
            await page.waitForTimeout(2700);
            try{await page.locator('.bookinfo .btnreadnow').last().click({timeout:7000})}catch(e){console.log('READ_CLICK_ERROR',e.message.slice(0,300))}
            await page.waitForTimeout(3500);
            try{await page.locator('.chapterlist [cid]:visible').first().click({timeout:7000})}catch(e){console.log('CHAPTER_CLICK_ERROR',e.message.slice(0,300))}
            await page.waitForTimeout(3800);
            console.log('RECORDS',JSON.stringify(records.slice(-24)));
            await browser.close();
          })().catch(e=>{console.error(e.stack);process.exit(1)});
          JS
