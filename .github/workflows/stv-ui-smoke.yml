name: Browser smoke test of official STV app UI
on:
  push:
    branches: [stv-capacitor-rebuild]
    paths: [.github/workflows/stv-ui-smoke.yml, 'repair/stv-ios-compat.js']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Setup Playwright browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Inspect loaded official UI without login
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const exceptions=[];
            const failed=[];
            page.on('pageerror',e=>exceptions.push(e.message.slice(0,220)));
            page.on('requestfailed',r=>failed.push(r.url().slice(0,140)+' '+r.failure()?.errorText));
            try{
              const response=await page.goto('https://sangtacviet.com/app.v2.php',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(8000);
              const state=await page.evaluate(()=>({
                href:location.href,
                title:document.title,
                app:typeof window.app,
                theme:typeof window.app?.theme,
                getColorVar:typeof window.app?.theme?.getColorVar,
                search:typeof window.app?.fun?.showSearch,
                historySync:typeof window.app?.history?.showSynchronizer,
                bodyText:document.body.innerText.slice(0,300)
              }));
              console.log('HTTP',response?.status());
              console.log('STATE',JSON.stringify(state));
              console.log('PAGE_ERRORS',JSON.stringify(exceptions.slice(0,12)));
              console.log('REQUEST_FAILED',JSON.stringify(failed.slice(0,12)));
            }catch(e){console.log('SMOKE_TEST_ERROR',e.message.slice(0,500))}
            await browser.close();
          })();
          NODE

      - name: Emulate Capacitor iOS JavaScript environment
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const errors=[];
            page.on('pageerror',e=>errors.push({message:e.message,stack:e.stack?.slice(0,550)}));
            await page.addInitScript({content:require('fs').readFileSync('repair/stv-ios-compat.js','utf8')});
            await page.addInitScript(()=>{
              const noop=()=>Promise.resolve({});
              const App={getLaunchUrl:async()=>null,addListener:noop,exitApp:noop};
              const StatusBar={setStyle:noop,hide:noop,show:noop,setOverlaysWebView:noop};
              const Keyboard={addListener:noop};
              window.Capacitor={platform:'ios',getPlatform:()=> 'ios',Plugins:{App,StatusBar,Keyboard}};
            });
            try{
              await page.goto('https://sangtacviet.com/app.v2.php',{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(8000);
              const state=await page.evaluate(()=>({
                theme:typeof window.app?.theme,search:typeof window.app?.fun?.showSearch,
                history:window.app?.history?.loaded,
                dbLoaded:typeof onDbLoad==='object'?onDbLoad.isLoaded:null,
                platform:window.app?.platform?.isIOS,
                text:document.body?.innerText?.slice(0,180)
              }));
              console.log('MOCK_IOS_STATE',JSON.stringify(state));
              if(state.theme !== 'object') throw new Error('Theme missing despite compatibility shim');
              console.log('MOCK_IOS_ERRORS',JSON.stringify(errors.slice(0,20)));
            }catch(e){console.log('MOCK_TEST_ERROR',e.message)}
            await browser.close();
          })();
          NODE
