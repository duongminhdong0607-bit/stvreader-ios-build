name: Browser smoke test of official STV app UI
on:
  push:
    branches: [stv-capacitor-rebuild]
    paths: [.github/workflows/stv-ui-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Setup Playwright browser
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium --with-deps
      - name: Inspect loaded official UI without login
        run: |
          node - <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
            const exceptions=[];
            const failed=[];
            page.on('pageerror',e=>exceptions.push(e.message.slice(0,220)));
            page.on('requestfailed',r=>failed.push(r.url().slice(0,140)+' '+r.failure()?.errorText));
            try{
              const response=await page.goto('https://sangtacviet.com/app.v2.php',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(8000);
              const state=await page.evaluate(()=>({
                href:location.href,
                title:document.title,
                app:typeof window.app,
                theme:typeof window.app?.theme,
                getColorVar:typeof window.app?.theme?.getColorVar,
                search:typeof window.app?.fun?.showSearch,
                historySync:typeof window.app?.history?.showSynchronizer,
                bodyText:document.body.innerText.slice(0,300)
              }));
              console.log('HTTP',response?.status());
              console.log('STATE',JSON.stringify(state));
              console.log('PAGE_ERRORS',JSON.stringify(exceptions.slice(0,12)));
              console.log('REQUEST_FAILED',JSON.stringify(failed.slice(0,12)));
            }catch(e){console.log('SMOKE_TEST_ERROR',e.message.slice(0,500))}
            await browser.close();
          })();
          NODE
