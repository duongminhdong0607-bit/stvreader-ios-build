name: Build STV MobileReader Search Sync fixed UI
on:
  push:
    branches: [stv-capacitor-rebuild]
    paths:
      - 'repair/**'
      - '.github/workflows/build-stv-capacitor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: repair
    steps:
      - uses: actions/checkout@v4
      - name: Restore intact original app interface assets from publisher CDN
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 -o original-truncated.ipa https://staticvn.sangtacvietcdn.xyz/download/stvmobilereader-1.3.2.ipa
          python3 extract_assets.py original-truncated.ipa www
          rm -f original-truncated.ipa
          # The damaged IPA contains an outdated index.html which requests
          # /asset/app.v2.main.js (HTTP 404). Never launch that obsolete page.
          cat > www/index.html <<'HTML'
          <!doctype html>
          <html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
          <body style="font:16px -apple-system,BlinkMacSystemFont,sans-serif;background:#f8f8f8;padding:30px;text-align:center">
          <h2>STV MobileReader</h2><p>Đang mở giao diện Sáng Tác Việt phiên bản hiện tại…</p>
          <p>Cần kết nối Internet để tìm kiếm và đồng bộ truyện.</p>
          <a href="https://sangtacviet.com/app.v2.php">Mở Sáng Tác Việt</a>
          </body></html>
          HTML
          if grep -q 'app.v2.main.js' www/index.html; then exit 51; fi
      - name: Check official app server
        shell: bash
        run: |
          curl -sSLI --max-time 20 https://sangtacviet.com/app.v2.php | head -15 || true
      - name: Install native Capacitor and iOS plugins
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios
          python3 patch_app_delegate.py
          grep -q 'STVActions.shared.prepare()' ios/App/App/AppDelegate.swift
          echo "Native dependency verification:"
          find ios -name '*.framework' -o -name '*.xcframework' | head -40
      - name: Build ARM64 IPA (unsigned, for Sideloadly)
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/stv-capacitor" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="$RUNNER_TEMP/stv-capacitor/Build/Products/Release-iphoneos/App.app"
          test -s "$APP/App"
          test -f "$APP/Info.plist"
          xcrun lipo -archs "$APP/App" | grep -w arm64
          mkdir -p Payload
          ditto "$APP" Payload/App.app
          zip -qry STVMobileReader-Search-Sync-Fixed-unsigned.ipa Payload
          unzip -t STVMobileReader-Search-Sync-Fixed-unsigned.ipa > /dev/null
          ls -lh STVMobileReader-Search-Sync-Fixed-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: STVMobileReader-Search-Sync-Fixed-IPA
          path: repair/STVMobileReader-Search-Sync-Fixed-unsigned.ipa
          retention-days: 7
