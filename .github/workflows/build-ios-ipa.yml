name: Build STV Reader Native IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Build native iPhone application
        run: |
          set -euo pipefail
          xcodebuild -project STVReader.xcodeproj -scheme STVReader -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/stvnative" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Verify native binary and package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/stvnative/Build/Products/Release-iphoneos/STVReader.app"
          test -s "$APP/STVReader"
          test -s "$APP/Info.plist"
          xcrun lipo -archs "$APP/STVReader" | grep -w arm64
          mkdir -p Payload
          ditto "$APP" Payload/STVReader.app
          zip -qry STVReader-Native-unsigned.ipa Payload
          unzip -t STVReader-Native-unsigned.ipa > /dev/null
          ls -lh STVReader-Native-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: STVReader-Native-unsigned-IPA
          path: STVReader-Native-unsigned.ipa
          retention-days: 7
