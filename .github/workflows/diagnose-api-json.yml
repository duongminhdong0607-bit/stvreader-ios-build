name: Inspect STV native API content negotiation
on:
  workflow_dispatch:
  push:
    branches: [stv-native-online-reader]
    paths: [.github/workflows/diagnose-api-json.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Check STV response variants without credentials
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse
          base='https://sangtacviet.com'
          params={'method':'search','minc':0,'category':'','findinname':'Hồng Hoang','find':'','sort':'','host':'','tag':'','step':'','p':0}
          url=base+'/io/searchtp/searchBooks?'+urllib.parse.urlencode(params)
          variations={
             'browser_only':{'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1','Referer':base+'/app.v2.php'},
             'ajax':{'User-Agent':'Mozilla/5.0','X-Requested-With':'XMLHttpRequest','Accept':'application/json','Referer':base+'/app.v2.php'},
             'json_contenttype':{'User-Agent':'Mozilla/5.0','Content-Type':'application/json','Accept':'application/json'},
             'xhr_contenttype':{'User-Agent':'Mozilla/5.0','Content-Type':'application/x-www-form-urlencoded; charset=UTF-8','Accept':'application/json, text/plain, */*','X-Requested-With':'XMLHttpRequest','Referer':base+'/app.v2.php'},
             'fetch':{'User-Agent':'Mozilla/5.0','Accept':'*/*','Sec-Fetch-Dest':'empty','Sec-Fetch-Mode':'cors','Sec-Fetch-Site':'same-origin','Referer':base+'/app.v2.php'}
          }
          for name,headers in variations.items():
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as res:
                      chunk=res.read(300)
                      print('VARIANT',name,'STATUS',res.status,'TYPE',res.headers.get('Content-Type'),'SIZE',res.headers.get('Content-Length'),'FIRST',repr(chunk[:170]))
              except Exception as e:
                  print('VARIANT',name,'ERROR',str(e)[:160])
          PY
