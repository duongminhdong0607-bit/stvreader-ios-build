name: Validate STV Native Swift and live public catalog
on:
  push:
    branches: [stv-native-online-reader]
    paths:
      - 'STVReader/**'
      - '.github/workflows/validate-native-stv.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse native Swift code (independent of iOS SDK)
        run: |
          set -eu
          swift --version
          swiftc -frontend -parse STVReader/STVReaderApp.swift
          echo "Swift syntax validated"
      - name: Check HTTPS public catalog and chapter list
        run: |
          python3 - <<'PY'
          import json,urllib.parse,urllib.request,re,html
          base='https://sangtacviet.com'
          def get(path,items):
            url=base+path+'?'+urllib.parse.urlencode(items)
            request=urllib.request.Request(url,headers={
              'Accept':'application/json, text/plain, */*',
              'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
              'Referer':'https://sangtacviet.com/app.v2.php',
              'Accept-Language':'vi-VN,vi;q=0.9'
            })
            with urllib.request.urlopen(request,timeout=22) as r:
              assert r.status==200
              raw=r.read()
              print('HTTP_RESPONSE',r.status,r.headers.get('Content-Type'),len(raw))
              if raw.lstrip().startswith(b'{'): return json.loads(raw)
              return raw.decode('utf-8','replace')
          try:
            results=get('/io/searchtp/searchBooks',{'method':'search','minc':'0','category':'','findinname':'Hồng Hoang','find':'','sort':'','host':'','tag':'','step':'','p':'0'})
            if isinstance(results,dict):
              count=len(results.get('list',[]))
              print('SEARCH_JSON_RESULTS',count)
            else:
              cards=re.findall(r'<a\\b(?=[^>]*\\bbooksearch\\b)[^>]*href="/truyen/([^/]+)/[^/]+/([^/]+)/"[^>]*>(.*?)</a>',results,re.I|re.S)
              titles=[html.unescape(re.sub(r'<[^>]+>','',re.search(r'<b[^>]*class="searchbooktitle"[^>]*>(.*?)</b>',card[2],re.S).group(1)).strip()) for card in cards if re.search(r'<b[^>]*class="searchbooktitle"[^>]*>(.*?)</b>',card[2],re.S)]
              count=len(titles)
              print('SEARCH_HTML_RESULTS',count,'TITLE_EXAMPLES',titles[:3])
            assert count>0
            chapters=get('/index.php',{'ngmar':'chapterlist','h':'uukanshu','bookid':'169690','sajax':'getchapterlist'})
            if isinstance(chapters,str): chapters=json.loads(chapters)
            raw=chapters.get('data','')
            parsed=[p.split('-/-',2) for p in raw.split('-//-') if '-/-' in p]
            print('CHAPTERS',len(parsed),'first',parsed[0][2][:100] if parsed else '')
            assert len(parsed)>0, 'No public chapters returned'
          except Exception as e:
            print('PUBLIC_API_TEST_FAILED',repr(e))
            raise
          PY
