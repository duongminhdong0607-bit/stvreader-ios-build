name: Probe STV anonymous sessions and HTML catalog
on:
  workflow_dispatch:
  push:
    branches: [stv-native-online-reader]
    paths: [.github/workflows/probe-stv-cookie.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - name: Compare anonymous session bootstrap and catalog
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,http.cookiejar,json
          base='https://sangtacviet.com'
          q=urllib.parse.urlencode({'method':'search','minc':'0','category':'','findinname':'Hồng Hoang','find':'','sort':'','host':'','tag':'','step':'','p':'0'})
          url=base+'/io/searchtp/searchBooks?'+q
          cookiejar=http.cookiejar.CookieJar()
          opener=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cookiejar))
          def get(url):
            headers={'User-Agent':'Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.5 Mobile/15E148 Safari/604.1',
                     'Accept':'application/json, text/plain, */*','Referer':base+'/app.v2.php','X-Requested-With':'XMLHttpRequest'}
            req=urllib.request.Request(url,headers=headers)
            with opener.open(req,timeout=20) as res:
              raw=res.read()
              print('RESULT',res.status,res.headers.get('content-type'),len(raw),'FIRST',repr(raw[:500]))
              return raw
          print('INITIAL_COOKIE_NAMES',list(c.name for c in cookiejar))
          get(base+'/app.v2.php')
          print('AFTER_BOOTSTRAP_COOKIE_NAMES',list(c.name for c in cookiejar))
          search=get(url)
          print('AFTER_SEARCH_COOKIE_NAMES',list(c.name for c in cookiejar))
          if search.lstrip().startswith(b'<'):
            print('HTML_CATALOG_HEAD',search[:3300].decode('utf-8','replace'))
          else:
            try: print('CATALOG_JSON_KEYS',list(json.loads(search).keys()))
            except Exception as e: print('CATALOG_PARSE_ERROR',repr(e))
          u=base+'/index.php?'+urllib.parse.urlencode({'ngmar':'chapterlist','h':'uukanshu','bookid':'169690','sajax':'getchapterlist'})
          chapter=get(u)
          print('CHAPTER_IS_JSON',chapter.lstrip().startswith(b'{'))
          PY
